# Paths point into the persistent Modal Volume (/cache). Dataset is fetched by
# `modal run infra/modal_app.py --stage download` into /cache/covrr.
# Verify the real subpaths from that stage's printed tree sample; adjust
# label_path / video_dir if the HF layout differs.
label_path: /cache/covrr/val-set_no-labels.json
video_dir: /cache/covrr
has_labels: false
encoder: openclip
vlm_model: Qwen/Qwen3-VL-32B-Instruct
vlm_fallback_model: Qwen/Qwen3-VL-8B-Instruct
n_self_consistency: 3
rerank_enabled: true
top_k: 50
fusion_alpha: 0.6
gallery_npz: /cache/covrx/gallery_val.npz
artifact_dir: /cache/covrx/val
submission_path: /cache/covrx/val_submission.json
